<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .ink   { fill: #1F2530; }
    .muted { fill: #66727F; }
    .gold  { fill: #B4820F; }
    .steel { fill: #3F566B; }
    .t-title { font-size: 21px; font-weight: 700; }
    .t-h     { font-size: 13px; font-weight: 700; }
    .t       { font-size: 12px; }
    .t-s     { font-size: 10.5px; }
    .t-mono  { font-family: Consolas, monospace; font-size: 12px; }
    .t-monos { font-family: Consolas, monospace; font-size: 10.5px; }
    .cell    { fill: #FFFFFF; stroke: #C9D0D8; stroke-width: 1.5; }
    .frame   { fill: none; stroke: #1F2530; stroke-width: 2; }
    .white-p { fill: #FFFFFF; stroke: #1F2530; stroke-width: 2.5; }
    .black-p { fill: #1F2530; }
  </style>

  <text x="30" y="38" class="ink t-title">Zug ausführen &amp; zurücknehmen — apply / unapply</text>
  <text x="30" y="58" class="muted t-s">In-place statt Kopie: der Zug wird direkt auf dem Board angewandt und exakt wieder rückgängig gemacht.</text>

  <!-- ===================== Board S0 (vorher) ===================== -->
  <g>
    <rect x="60" y="110" width="184" height="46" class="frame"/>
    <rect x="60"  y="110" width="46" height="46" class="cell"/>
    <rect x="106" y="110" width="46" height="46" class="cell"/>
    <rect x="152" y="110" width="46" height="46" class="cell"/>
    <rect x="198" y="110" width="46" height="46" class="cell"/>
    <circle cx="83"  cy="133" r="15" class="white-p"/>
    <circle cx="175" cy="133" r="15" class="black-p"/>
    <circle cx="221" cy="133" r="15" class="white-p"/>
    <text x="152" y="178" text-anchor="middle" class="muted t-s">S₀ — vor dem Zug</text>
    <!-- geplante Bewegung -->
    <path d="M 83 95 L 129 95" stroke="#B4820F" stroke-width="2" fill="none" marker-end="url(#ah-gold)"/>
    <text x="106" y="88" text-anchor="middle" class="gold t-monos">→</text>
  </g>

  <!-- ===================== Board S1 (nachher) ===================== -->
  <g>
    <rect x="640" y="110" width="184" height="46" class="frame"/>
    <rect x="640" y="110" width="46" height="46" class="cell"/>
    <rect x="686" y="110" width="46" height="46" class="cell"/>
    <rect x="732" y="110" width="46" height="46" class="cell"/>
    <rect x="778" y="110" width="46" height="46" class="cell"/>
    <circle cx="709" cy="133" r="15" class="white-p"/>
    <circle cx="801" cy="133" r="15" class="white-p"/>
    <!-- geschlagene Figur -->
    <circle cx="755" cy="133" r="15" class="black-p" opacity="0.3"/>
    <line x1="746" y1="124" x2="764" y2="142" stroke="#C0392B" stroke-width="2.5"/>
    <line x1="764" y1="124" x2="746" y2="142" stroke="#C0392B" stroke-width="2.5"/>
    <text x="732" y="178" text-anchor="middle" class="muted t-s">S₁ — nach dem Zug</text>
  </g>

  <!-- ===================== Pfeile Mitte ===================== -->
  <defs>
    <marker id="ah-gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#D8A62E"/>
    </marker>
    <marker id="ah-steel" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3F566B"/>
    </marker>
  </defs>

  <!-- apply -->
  <text x="442" y="106" text-anchor="middle" class="gold t-mono">makeMove( )  ·  apply</text>
  <line x1="262" y1="120" x2="622" y2="120" stroke="#D8A62E" stroke-width="3" marker-end="url(#ah-gold)"/>
  <text x="442" y="140" text-anchor="middle" class="muted t-s">Figur setzen · Schlag ausführen · Hash XOR · Zug wechseln</text>

  <!-- unapply -->
  <text x="442" y="176" text-anchor="middle" class="steel t-mono">unmakeMove( )  ·  unapply</text>
  <line x1="622" y1="150" x2="262" y2="150" stroke="#3F566B" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ah-steel)"/>
  <text x="442" y="196" text-anchor="middle" class="muted t-s">Figur zurück · Geschlagene restaurieren · Hash zurück · Zug zurück</text>

  <!-- ===================== Undo-Daten Karte ===================== -->
  <rect x="60" y="238" width="470" height="150" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5" rx="8"/>
  <text x="80" y="266" class="ink t-h">Move speichert die Undo-Daten</text>
  <text x="80" y="294" class="steel t-monos">from → to</text>
  <text x="200" y="294" class="muted t-s">Rückweg der Figur</text>
  <text x="80" y="320" class="steel t-monos">capturedFigures[ ]</text>
  <text x="240" y="320" class="muted t-s">geschlagene Figuren</text>
  <text x="80" y="346" class="steel t-monos">hash (XOR)</text>
  <text x="200" y="346" class="muted t-s">reversibel: XOR ist seine eigene Umkehr</text>
  <text x="80" y="374" class="muted t-s">→ deshalb genügt das Move-Objekt, um S₁ exakt zu S₀ zurückzusetzen.</text>

  <!-- ===================== Nutzen-Banner ===================== -->
  <rect x="550" y="238" width="370" height="150" fill="#F6F0DE" stroke="#E4CE93" stroke-width="1.5" rx="8"/>
  <text x="570" y="266" class="gold t-h">Warum so?</text>
  <text x="570" y="294" class="ink t-s">Kein <tspan class="t-monos">board.copy()</tspan> pro Knoten.</text>
  <text x="570" y="318" class="ink t-s">Ein Board, das durch den ganzen</text>
  <text x="570" y="336" class="ink t-s">Suchbaum wandert — apply hinein,</text>
  <text x="570" y="354" class="ink t-s">unapply heraus.</text>
  <text x="570" y="380" class="gold t-s" font-weight="700">= weniger Speicher · mehr Suchtiefe</text>
</svg>
